<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Lagao.shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ========== HEADER / NAVBAR ========== -->
  <header>
    <div class="logo">
      <a href="index.html">
        <img src="logo.png" alt="Lagao.shop Logo">
      </a>
    </div>

    <nav>
      <a href="plants.html">Plants</a>
      <a href="index.html#categories">Categories</a>
      <a href="index.html#about">About</a>
    </nav>

    <div class="search-box" style="display: none;"></div>

    <nav>
      <a href="cart.html">Cart</a>
      <a href="login.html">Account</a>
    </nav>
  </header>

  <!-- ========== LOGIN FORM ========== -->
  <section style="padding: 140px 20px 80px; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div class="form-container">
      <h2>Welcome Back</h2>
      <p>Log in to your Lagao account</p>

      <form>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px;">
          Log In
        </button>
      </form>

      <!-- Firebase Connection Note -->
      <div style="padding: 15px; background: #f0f8f4; border-radius: 12px; margin-top: 20px; font-size: 12px; color: var(--muted);">
        💡 Firebase Authentication will be connected here: <code>firebase.auth().signInWithEmailAndPassword(email, password)</code>
      </div>

      <div class="divider">or</div>

      <div class="oauth-buttons">
        <button type="button" class="btn btn-google">
          🔵 Continue with Google
        </button>
      </div>

      <div class="form-link">
        Don't have an account? <a href="signup.html">Sign up here</a>
      </div>
    </div>
  </section>

  <!-- ========== FOOTER ========== -->
  <footer>
    <h3>Lagao.shop</h3>
    <p>© 2026 Lagao Nursery</p>
  </footer>

  <script src="script.js"></script>

</body>

</html>
