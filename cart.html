<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - Lagao.shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ========== HEADER / NAVBAR ========== -->
  <header>
    <div class="logo">
      <a href="index.html">
        <img src="logo.png" alt="Lagao.shop Logo">
      </a>
    </div>

    <nav>
      <a href="plants.html">Plants</a>
      <a href="index.html#categories">Categories</a>
      <a href="index.html#about">About</a>
    </nav>

    <div class="search-box" style="display: none;"></div>

    <nav>
      <a href="cart.html">Cart</a>
      <a href="login.html">Account</a>
    </nav>
  </header>

  <!-- ========== CART CONTAINER ========== -->
  <div class="cart-container">
    <h1 class="cart-title">Your Cart</h1>

    <div id="cart-content">
      <!-- Cart items will be rendered here by JavaScript -->
      <div class="empty-cart">
        <h2>Your cart is empty</h2>
        <p>Time to bring some green into your life!</p>
        <a href="plants.html" class="btn btn-primary">Start Shopping</a>
      </div>
    </div>

    <!-- Cart content template (hidden) -->
    <div id="cart-template" style="display: none;">
      <div class="cart-content">
        <div class="cart-items" id="cart-items-list">
          <!-- Items will be inserted here -->
        </div>

        <div class="cart-summary">
          <div class="summary-row">
            <span>Subtotal:</span>
            <span id="subtotal">₹0</span>
          </div>
          <div class="summary-row">
            <span>Shipping:</span>
            <span>Free</span>
          </div>
          <div class="summary-row">
            <span>Tax (5%):</span>
            <span id="tax">₹0</span>
          </div>
          <div class="summary-row total">
            <span>Total:</span>
            <span id="total">₹0</span>
          </div>
          <button class="btn btn-primary" style="width: 100%;">Proceed to Checkout</button>
          <a href="plants.html" class="btn btn-outline" style="width: 100%; margin-top: 10px; text-align: center;">Continue Shopping</a>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== FOOTER ========== -->
  <footer>
    <h3>Lagao.shop</h3>
    <p>© 2026 Lagao Nursery</p>
  </footer>

  <script>
    // Render cart on page load
    window.addEventListener('DOMContentLoaded', () => {
      renderCart();
    });

    function renderCart() {
      const cartContainer = document.getElementById('cart-content');
      const cart = JSON.parse(localStorage.getItem('cart')) || [];

      if (cart.length === 0) {
        cartContainer.innerHTML = `
          <div class="empty-cart">
            <h2>Your cart is empty</h2>
            <p>Time to bring some green into your life!</p>
            <a href="plants.html" class="btn btn-primary">Start Shopping</a>
          </div>
        `;
        return;
      }

      let itemsHTML = '';
      let subtotal = 0;

      cart.forEach(item => {
        const itemTotal = item.price * item.quantity;
        subtotal += itemTotal;
        itemsHTML += `
          <div class="cart-item">
            <img src="${item.image}" alt="${item.name}">
            <div class="cart-item-info">
              <h3>${item.name}</h3>
              <p>₹${item.price} each</p>
              <div style="display: flex; gap: 10px; align-items: center; margin-top: 10px;">
                <button onclick="updateQuantity('${item.id}', ${item.quantity - 1})" style="padding: 5px 10px; border: 1px solid #e8e5df; background: white; border-radius: 6px; cursor: pointer;">-</button>
                <span>${item.quantity}</span>
                <button onclick="updateQuantity('${item.id}', ${item.quantity + 1})" style="padding: 5px 10px; border: 1px solid #e8e5df; background: white; border-radius: 6px; cursor: pointer;">+</button>
                <button onclick="removeItem('${item.id}')" style="padding: 5px 10px; border: 1px solid #e8e5df; background: white; border-radius: 6px; cursor: pointer; color: #e74c3c; margin-left: auto;">Remove</button>
              </div>
            </div>
            <div class="cart-item-price">₹${itemTotal}</div>
          </div>
        `;
      });

      const tax = Math.round(subtotal * 0.05);
      const total = subtotal + tax;

      const template = document.getElementById('cart-template');
      template.style.display = 'block';
      document.getElementById('cart-items-list').innerHTML = itemsHTML;
      document.getElementById('subtotal').textContent = '₹' + subtotal;
      document.getElementById('tax').textContent = '₹' + tax;
      document.getElementById('total').textContent = '₹' + total;

      cartContainer.innerHTML = template.innerHTML;
      template.style.display = 'none';
    }

    function updateQuantity(plantId, newQuantity) {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const item = cart.find(i => i.id === plantId);
      if (item) {
        item.quantity = Math.max(0, newQuantity);
        if (item.quantity === 0) {
          cart = cart.filter(i => i.id !== plantId);
        }
        localStorage.setItem('cart', JSON.stringify(cart.filter(i => i.quantity > 0)));
        renderCart();
      }
    }

    function removeItem(plantId) {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const updatedCart = cart.filter(i => i.id !== plantId);
      localStorage.setItem('cart', JSON.stringify(updatedCart));
      renderCart();
    }
  </script>

  <script src="script.js"></script>

</body>

</html>
